name: Download Produtos Shopee/Shein

on:
  workflow_dispatch:
  schedule:
    # Roda automaticamente 2x ao dia: 08:00 e 20:00 UTC
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  push:
    paths:
      - 'links.txt'
      - 'src/**'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Rodar downloader
        run: python src/run_download.py

      - name: Upload dos arquivos baixados (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ github.run_number }}
          path: downloads/
          retention-days: 15

      - name: Commit dos resultados (para versionamento)
        if: always()
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add downloads/ links.txt
            git commit -m "Atualizar downloads (run ${{ github.run_number }})" || echo "Nada para commitar"
            git push || echo "Push falhou (ok se nada mudou)"
          fi
          echo "::notice::Download concluído. Baixe os arquivos em Actions > run mais recente > Artifacts."