name: Download Produtos Shein

on:
  workflow_dispatch:
  schedule:
    # Roda 2x ao dia: 08:00 e 20:00 UTC
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  push:
    paths:
      - 'links.txt'
      - 'src/**'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Rodar downloader
        run: python src/run_download.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shein-downloads-${{ github.run_number }}
          path: downloads/
          retention-days: 15

      - name: Aviso
        if: always()
        run: echo "::notice::Download concluído! Baixe em Actions → run mais recente → Artifacts → shein-downloads"